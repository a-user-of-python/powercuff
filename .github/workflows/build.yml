name: Build Powercuff (rootless)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Link Xcode SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS/sdks
          XCODE_SDK=$(ls -d /Applications/Xcode*.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk | head -1)
          echo "Using SDK: $XCODE_SDK"
          ln -sf "$XCODE_SDK" $THEOS/sdks/iPhoneOS.sdk
          ls -la $THEOS/sdks/

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: powercuff-rootless
          path: packages/*.deb
